services:
  db:
    image: postgres:16-alpine
    container_name: eticketsgo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eticketsgo
      POSTGRES_PASSWORD: eticketsgo
      POSTGRES_DB: eticketsgo
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eticketsgo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eticketsgo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  redis-data:
