name: CI

on:
  push:
    # The promotion flow is: feature -> develop (QA) -> release/* (UAT) -> main (Production).
    # Every branch that can trigger a deployment must run this gate on push, so the commit
    # that reaches an environment is the commit that was verified.
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']
  # Allow the deploy pipelines (.github/workflows/deploy.yml, deploy-railway.yml) to reuse
  # this exact gate via `uses: ./.github/workflows/ci.yml`. Additive — existing push/PR
  # triggers and all jobs below are unchanged.
  workflow_call:

# Cancel superseded in-progress runs for the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eticketsgo
          POSTGRES_PASSWORD: eticketsgo
          POSTGRES_DB: eticketsgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eticketsgo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://eticketsgo:eticketsgo@localhost:5432/eticketsgo?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      QR_SIGNING_SECRET: ci-qr-secret
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Persist Turborepo's local cache so unchanged build/typecheck/test tasks are
      # restored instead of re-run.
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: |
            turbo-

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run packages:build

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Circular dependency check
        run: npm run deps:check

      # Offline gate for the Railway deployment configuration: start commands that resolve
      # against the image WORKDIR, a single migration executor, no destructive Prisma
      # command, no credential committed to an environment template. Needs no cloud access.
      - name: Deployment configuration check
        run: npm run verify:deploy

      - name: Apply migrations & seed
        run: |
          npm run db:deploy
          npm run db:seed

      - name: Unit tests
        run: npm run test

      - name: Build all apps
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        # Always install OS deps; download the browser only on a cache miss.
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
        working-directory: apps/e2e

      - name: Start services
        # The e2e suite runs many login-heavy specs within a minute; raise the auth
        # throttle for this test run only (production leaves it unset → 10/min per IP).
        env:
          AUTH_THROTTLE_LIMIT: '1000'
        run: |
          node apps/api/dist/main.js & echo $! > /tmp/api.pid
          npx --workspace @eticketsgo/customer-web next start -p 3000 & echo $! > /tmp/cust.pid
          npx --workspace @eticketsgo/organizer-web next start -p 3001 & echo $! > /tmp/org.pid
          npx --workspace @eticketsgo/admin-web next start -p 3002 & echo $! > /tmp/admin.pid
          npx wait-on http://localhost:4000/api/health http://localhost:3000 http://localhost:3001 http://localhost:3002 --timeout 60000

      - name: Playwright e2e
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
