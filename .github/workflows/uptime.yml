# External uptime check for PRODUCTION (read-only).
#
# Why: on 2026-10-25 every production deployment was removed at 10:18 UTC and the whole site
# answered Railway's "Application not found" for ~7 hours. Nothing alerted; Google Search
# Console's sitemap 404 was the first signal. This job requests the public URLs from outside
# Railway once an hour and FAILS when one is down, so GitHub sends its failure email.
#
# Read-only GETs only. No secrets. Hourly (not more often) to stay inside the Actions budget.
# Make sure the person who receives this repository's Actions failure emails watches them, or
# add a dedicated uptime service (see docs/release/MASTER-READINESS.md, INC3/L13).
name: Uptime (production)

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public production URLs answer
        run: |
          set -u
          fail=0
          check() {
            url="$1"; want="$2"
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 "$url" || echo 000)
            if [ "$code" != "$want" ]; then
              echo "::error::$url answered $code (expected $want): $(head -c 160 /tmp/body)"
              fail=1
            else
              echo "ok  $code  $url"
            fi
          }
          check https://www.eticketsgo.com/ 200
          check https://www.eticketsgo.com/sitemap.xml 200
          check https://www.eticketsgo.com/robots.txt 200
          check https://www.eticketsgo.com/delete-account 200
          check https://api.eticketsgo.com/api/health 200
          check https://api.eticketsgo.com/api/ready 200
          check https://admin.eticketsgo.com/ 200
          check https://organizer.eticketsgo.com/ 200
          # The sitemap must be XML, not Railway's JSON fallback.
          if ! curl -s --max-time 20 https://www.eticketsgo.com/sitemap.xml | head -c 200 | grep -q '<urlset'; then
            echo "::error::sitemap.xml is not a sitemap"; fail=1
          fi
          exit $fail
