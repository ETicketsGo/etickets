<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — ETicketsGo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: #0b0f1a;
        color: #e5e7eb;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #9ca3af;
        line-height: 1.5;
        margin: 0.25rem 0;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        color: #a5b4fc;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>This page hasn't been saved for offline use yet.</p>
      <p>Open a ticket once while connected, then it will be available here without a connection.</p>
      <a href="/account/tickets">Go to My experiences</a>
    </div>
  </body>
</html>
